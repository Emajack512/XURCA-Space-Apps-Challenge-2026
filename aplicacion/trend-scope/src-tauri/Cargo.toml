[package]
name = "trend-scope"
version = "0.1.0"
description = "TrendScope: descarga, grafica y analiza tendencias de datos ambientales públicos (NASA Space Apps 2026, equipo XURCA)"
authors = ["Equipo XURCA (Acrux)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Declaración de uso de Súper Inteligencia (SI): ver USO_DE_IA.md en la raíz del repositorio.
[package.metadata.ai-assistance]
ai-generated-code = true
tools = ["Claude Code (Anthropic)", "Codex (OpenAI)", "Gemini (Google) en el asistente de la app"]
human-review = true
disclosure = "USO_DE_IA.md"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trend_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# the same as the package name
name = "trend-scope"
path = "src/main.rs"
required-features = ["pytauri/standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.8.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25" }
pytauri = { version = "0.8", features = [] }
tauri-plugin-pytauri = { version = "0.8" }
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-fs = "=2.4.2"
